name: Generate RSS Feed

on:
  push:
    paths:
      - "articlesmarina.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSS
        run: |
          python3 << 'EOF'
          import json, datetime

          site = "https://aditya-cmd-max.github.io/marina"

          with open("articlesmarina.json") as f:
              articles = json.load(f)

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0">
<channel>
<title>Reverbit Marina</title>
<link>{site}</link>
<description>Technology News, AI Insights and Software Engineering</description>
<language>en-us</language>
<lastBuildDate>{datetime.datetime.utcnow()}</lastBuildDate>
"""

          for a in articles:
              rss += f"""
<item>
<title>{a['title']}</title>
<link>{a['link']}</link>
<description>{a['description']}</description>
<pubDate>{a['date']}</pubDate>
<guid>{a['link']}</guid>
</item>
"""

          rss += "</channel></rss>"

          with open("rss.xml","w") as f:
              f.write(rss)
          EOF

      - name: Commit RSS
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add rss.xml
          git commit -m "Auto update RSS" || echo "No changes"
          git push
