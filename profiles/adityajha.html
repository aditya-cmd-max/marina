<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Aditya Jha | Reverbit Marina</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@300;400;500;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Auth.js -->
    <script src="https://aditya-cmd-max.github.io/js/auth.js"></script>
    <meta name="google-adsense-account" content="ca-pub-6544559221754441">
    
    <style>
        /* ===== ORIGINAL BEAUTIFUL COLOR SYSTEM ===== */
        :root {
            --md-primary: #1a73e8;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #d2e3fc;
            --md-on-primary-container: #001d3d;
            
            --md-surface: #FFFFFF;
            --md-on-surface: #202124;
            --md-surface-variant: #F8F9FA;
            --md-on-surface-variant: #5f6368;
            
            --md-background: #FFFFFF;
            --md-on-background: #202124;
            
            --md-outline: #DADCE0;
            --md-outline-variant: #E8EAED;
            
            --md-elevation-1: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --md-elevation-2: 0 1px 2px rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            --md-elevation-3: 0 1px 3px 1px rgba(60,64,67,0.15), 0 1px 2px rgba(60,64,67,0.3);
            
            --md-transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            
            --md-radius-small: 8px;
            --md-radius-medium: 12px;
            --md-radius-large: 16px;
            --md-radius-extra-large: 24px;
            --md-radius-pill: 9999px;
            
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            
            --font-logo: 'Playfair Display', serif;
            --font-heading: 'Inter', sans-serif;
            --font-body: 'Lora', serif;
            --font-product: 'Product Sans', sans-serif;
        }

        .dark-theme {
            --md-surface: #202124;
            --md-on-surface: #E8EAED;
            --md-surface-variant: #303134;
            --md-on-surface-variant: #9AA0A6;
            --md-background: #202124;
            --md-on-background: #E8EAED;
            --md-primary-container: #174ea6;
            --md-on-primary-container: #E8EAED;
            --md-outline: #3C4043;
            --md-outline-variant: #5F6368;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--md-background);
            color: var(--md-on-surface);
            line-height: 1.6;
            overflow-x: hidden;
            transition: var(--md-transition);
        }

        /* ===== BACKGROUND ===== */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.08;
            background-image: 
                linear-gradient(var(--md-primary) 1px, transparent 1px),
                linear-gradient(90deg, var(--md-primary) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: meshMove 25s linear infinite;
        }

        .mesh-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(
                circle at 30% 70%,
                rgba(26, 115, 232, 0.12) 0%,
                transparent 50%
            ), radial-gradient(
                circle at 70% 30%,
                rgba(26, 115, 232, 0.08) 0%,
                transparent 50%
            );
            animation: pulse 10s ease-in-out infinite;
        }

        @keyframes meshMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 20px;
            z-index: 100;
            padding: 0 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 95%;
        }

        .header-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--md-outline);
            border-radius: var(--md-radius-pill);
            padding: 8px 16px 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--md-elevation-2);
        }

        .dark-theme .header-container {
            background: rgba(32,33,36,0.95);
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
        }

        .logo-text {
            width: 160px;
            height: 36px;
            background: url('https://aditya-cmd-max.github.io/Reverbit.svg') no-repeat left/contain;
            transition: filter 0.3s;
        }

        @media (max-width: 768px) {
            .logo-text {
                width: 130px;
                height: 32px;
            }
        }

        .dark-theme .logo-text {
            filter: brightness(0) invert(1);
        }

        /* Desktop Nav */
        .desktop-nav {
            display: none;
            align-items: center;
            gap: 4px;
            background: var(--md-surface-variant);
            padding: 4px;
            border-radius: var(--md-radius-pill);
        }

        @media (min-width:900px){.desktop-nav{display:flex;}}

        .nav-item {
            padding: 8px 20px;
            border-radius: var(--md-radius-pill);
            font-family: var(--font-heading);
            font-weight: 500;
            color: var(--md-on-surface);
            text-decoration: none;
            transition: var(--md-transition);
        }

        .nav-item:hover {
            background: var(--md-surface);
            color: var(--md-primary);
        }

        .nav-item.active {
            background: var(--md-primary);
            color: white;
        }

        /* Header Actions */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--md-surface-variant);
            color: var(--md-on-surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--md-transition);
        }

        .icon-btn:hover {
            background: var(--md-primary);
            color: white;
        }

        /* Theme toggle */
        .theme-toggle {
            display: flex;
        }

        /* Auth avatar */
        #authAvatarContainer {
            display: flex;
            align-items: center;
        }

        .hamburger-btn { display: flex; }
        @media (min-width:900px){.hamburger-btn{display:none;}}

        /* ===== HAMBURGER MENU ===== */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 199;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .hamburger-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 360px;
            height: 100vh;
            background: var(--md-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            transition: right 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            border-left: 1px solid var(--md-outline);
            box-shadow: var(--md-elevation-3);
            overflow-y: auto;
            padding: 80px 24px 40px;
        }

        .hamburger-menu.active { 
            right: 0; 
        }

        .menu-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--md-surface-variant);
            color: var(--md-on-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: var(--md-transition);
            z-index: 10;
        }

        .menu-close:hover {
            background: var(--md-primary);
            color: white;
            transform: rotate(90deg);
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 20px;
        }

        .menu-link {
            padding: 14px 20px;
            border-radius: var(--md-radius-pill);
            color: var(--md-on-surface);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 500;
            transition: var(--md-transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-link i {
            width: 24px;
            color: var(--md-primary);
        }

        .menu-link:hover {
            background: var(--md-surface-variant);
            transform: translateX(8px);
        }

        .menu-link.active {
            background: var(--md-primary);
            color: white;
        }

        .menu-link.active i {
            color: white;
        }

        .menu-theme {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-pill);
            margin: 20px 0;
            cursor: pointer;
            transition: var(--md-transition);
        }

        .menu-theme:hover {
            background: var(--md-primary-container);
        }

        .menu-theme-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-heading);
            font-weight: 500;
        }

        .menu-theme-left i {
            color: var(--md-primary);
        }

        .signin-btn {
            background: linear-gradient(135deg, var(--md-primary), #0d47a1);
            color: white !important;
            margin-top: 30px;
            text-align: center;
            font-weight: 600;
            padding: 16px;
            border-radius: var(--md-radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--md-elevation-2);
            border: none;
            transition: var(--md-transition);
        }

        .signin-btn i {
            color: white !important;
            font-size: 1.2rem;
        }

        .signin-btn:hover {
            background: linear-gradient(135deg, #0d47a1, #0a336b);
            transform: translateY(-2px);
            box-shadow: var(--md-elevation-3);
        }

        .menu-user {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-large);
            margin-bottom: 30px;
            border: 1px solid var(--md-outline);
        }

        .menu-user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--md-primary);
        }

        .menu-user-info h4 {
            font-family: var(--font-heading);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .menu-user-info p {
            font-size: 0.85rem;
            color: var(--md-on-surface-variant);
        }

        /* ===== PROFILE CONTAINER ===== */
        .profile-container {
            max-width: 1200px;
            margin: 40px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* ===== HERO SECTION ===== */
        .profile-hero {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: var(--space-2xl);
            margin-bottom: var(--space-2xl);
            align-items: center;
        }

        @media (max-width: 768px) {
            .profile-hero {
                grid-template-columns: 1fr;
                gap: var(--space-xl);
                text-align: center;
            }
        }

        .profile-image-container {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .profile-image-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg width="282" height="281" viewBox="0 0 282 281" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M75.9469 280.078C91.5033 280.078 105.96 275.398 117.97 267.376C130.585 258.951 151.308 258.951 163.924 267.376C175.934 275.398 190.39 280.078 205.947 280.078C247.615 280.078 281.394 246.499 281.394 205.078C281.394 189.768 276.779 175.529 268.856 163.661C260.282 150.817 260.282 129.339 268.856 116.496C276.779 104.628 281.394 90.3887 281.394 75.0781C281.394 33.6568 247.615 0.078125 205.947 0.078125C190.39 0.078125 175.934 4.75843 163.924 12.7798C151.308 21.2056 130.585 21.2056 117.97 12.7798C105.96 4.75843 91.5033 0.078125 75.9469 0.078125C34.2787 0.078125 0.5 33.6568 0.5 75.0781C0.5 90.3887 5.11505 104.628 13.0377 116.496C21.6119 129.339 21.6119 150.817 13.0377 163.661C5.11505 175.529 0.5 189.768 0.5 205.078C0.5 246.499 34.2787 280.078 75.9469 280.078Z" fill="black"/></svg>');

            -webkit-mask-position: center;

            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
            border: 3px solid var(--md-primary);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .profile-name {
            font-family: var(--font-product);
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            font-weight: 700;
            color: var(--md-on-surface);
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: var(--space-sm);
        }

        .profile-role {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--md-primary);
            margin-bottom: var(--space-md);
        }

        .profile-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: var(--space-md);
        }

        .badge {
            padding: 6px 16px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border-radius: var(--md-radius-pill);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .profile-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--md-on-surface-variant);
        }

        .profile-meta-item i, .profile-meta-item .material-icons-round {
            color: var(--md-primary);
            font-size: 1.2rem;
        }

        .profile-bio {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--md-on-surface);
            margin: var(--space-md) 0;
        }

        .profile-social {
            display: flex;
            gap: 12px;
            margin-top: var(--space-md);
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--md-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface);
            text-decoration: none;
            transition: var(--md-transition);
            font-size: 1.2rem;
        }

        .social-icon:hover {
            background: var(--md-primary);
            color: white;
            transform: translateY(-2px);
        }

        /* ===== SECTIONS ===== */
        .section {
            margin: var(--space-2xl) 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: var(--space-xl);
            padding-bottom: 12px;
            border-bottom: 2px solid var(--md-outline);
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 0;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--md-primary), transparent);
            border-radius: 2px;
        }

        .section-link {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--md-primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--md-transition);
        }

        .section-link:hover {
            gap: 8px;
        }

        /* ===== ARTICLES GRID ===== */
        .articles-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width:640px){ .articles-grid{ grid-template-columns:repeat(2,1fr); } }
        @media (min-width:1024px){ .articles-grid{ grid-template-columns:repeat(3,1fr); } }

        .article-card {
            background: var(--md-surface);
            border-radius: var(--md-radius-large);
            overflow: hidden;
            box-shadow: var(--md-elevation-2);
            border: 1px solid var(--md-outline);
            transition: var(--md-transition);
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            height: 100%;
        }

        .article-card:hover {
            box-shadow: var(--md-elevation-3);
            transform: translateY(-6px);
        }

        .article-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--md-surface-variant);
            transition: transform 0.5s;
        }

        .article-card:hover .article-image {
            transform: scale(1.05);
        }

        .article-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .article-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border-radius: var(--md-radius-pill);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            width: fit-content;
        }
        
        .article-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4; 
            color: var(--md-on-surface);
        }

        .article-excerpt {
            color: var(--md-on-surface-variant);
            margin-bottom: 16px;
            font-size: 0.9rem;
            flex: 1;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--md-on-surface-variant);
            margin-bottom: 16px;
        }

        .read-btn {
            margin-top: 12px;
            padding: 12px 20px;
            background: transparent;
            border: 1px solid var(--md-outline);
            border-radius: var(--md-radius-pill);
            color: var(--md-on-surface);
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--md-transition);
            width: 100%;
        }

        .read-btn:hover {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }

        /* ===== CARDS GRID ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width:640px){ .cards-grid{ grid-template-columns:repeat(2,1fr); } }

        .profile-card {
            background: var(--md-surface);
            border-radius: var(--md-radius-large);
            padding: var(--space-xl);
            box-shadow: var(--md-elevation-2);
            border: 1px solid var(--md-outline);
            transition: var(--md-transition);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .profile-card:hover {
            box-shadow: var(--md-elevation-3);
            transform: translateY(-6px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--md-radius-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
        }

        .card-icon i {
            font-size: 26px;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--md-on-surface);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .card-description {
            color: var(--md-on-surface-variant);
            line-height: 1.6;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-lg);
            background: var(--md-primary);
            color: white;
            border-radius: var(--md-radius-pill);
            text-decoration: none;
            font-weight: 500;
            transition: var(--md-transition);
            width: fit-content;
            margin-top: var(--space-sm);
        }

        .card-link:hover {
            background: #0d47a1;
            transform: translateY(-2px);
            box-shadow: var(--md-elevation-2);
        }

        /* ===== STATS CARD ===== */
        .stats-card {
            display: flex;
            justify-content: space-around;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-large);
            padding: var(--space-xl);
            margin-bottom: var(--space-2xl);
            border: 1px solid var(--md-outline);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--md-primary);
            line-height: 1;
        }

        .stat-label {
            color: var(--md-on-surface-variant);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--md-outline);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--md-on-surface-variant);
            background: var(--md-surface);
            border-radius: var(--md-radius-large);
            border: 1px solid var(--md-outline);
        }

        @keyframes spin { to{ transform: rotate(360deg); } }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--md-surface);
            border-top: 1px solid var(--md-outline);
            padding: 60px 20px 30px;
            position: relative;
            overflow: hidden;
            margin-top: 60px;
        }

        .footer-svgs {
            position: absolute;
            inset: 0;
            opacity: 0.05;
            pointer-events: none;
        }

        .footer-svg {
            position: absolute;
            animation: footerFloat 20s infinite linear;
            fill: var(--md-primary);
        }

        .footer-svg-1 {
            top: 10%;
            left: 5%;
            width: 120px;
        }
        .footer-svg-2 {
            bottom: 20%;
            right: 10%;
            width: 100px;
            animation-delay: -7s;
        }
        .footer-svg-3 {
            top: 40%;
            right: 15%;
            width: 80px;
            animation-delay: -14s;
        }

        @keyframes footerFloat {
            0%,100%{transform:translateY(0)rotate(0deg)}
            33%{transform:translateY(-15px)rotate(3deg)}
            66%{transform:translateY(10px)rotate(-3deg)}
        }

        .footer-brand {
            font-family: var(--font-logo);
            font-size: clamp(80px, 20vw, 180px);
            font-weight: 900;
            line-height: 0.8;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--md-primary), #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            word-break: break-word;
        }

        .footer-tagline {
            font-size: 1.2rem;
            color: var(--md-on-surface-variant);
            max-width: 600px;
            margin-bottom: 50px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        @media (min-width:700px){ .footer-grid{ grid-template-columns:repeat(3,1fr); } }

        .footer-col h4 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }

        .footer-col h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 3px;
            background: var(--md-primary);
        }

        .footer-col a {
            display: block;
            color: var(--md-on-surface-variant);
            text-decoration: none;
            margin-bottom: 10px;
            transition: var(--md-transition);
        }

        .footer-col a:hover {
            color: var(--md-primary);
            transform: translateX(4px);
        }

        .footer-bottom {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 30px;
            border-top: 1px solid var(--md-outline);
            align-items: center;
            text-align: center;
        }

        @media (min-width:700px){ 
            .footer-bottom{ 
                flex-direction: row; 
                justify-content: space-between; 
                text-align: left; 
                align-items: center;
            }
        }

        .footer-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 699px) {
            .footer-logo-wrapper {
                justify-content: center;
                width: 100%;
            }
        }

        .footer-logo {
            width: 160px;
            height: 36px;
            background: url('https://aditya-cmd-max.github.io/Reverbit.svg') no-repeat left/contain;
            transition: filter 0.3s;
            display: inline-block;
        }

        .dark-theme .footer-logo {
            filter: brightness(0) invert(1);
        }

        .footer-attribution {
            font-size: 0.9rem;
            color: var(--md-on-surface-variant);
            margin-top: 10px;
        }

        .footer-attribution i {
            color: #ff4d4d;
            animation: heartbeat 1.5s ease infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .social-links {
            display: flex;
            gap: 10px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--md-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface);
            text-decoration: none;
            transition: var(--md-transition);
            font-size: 1.2rem;
        }

        .social-link:hover {
            background: var(--md-primary);
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width:480px){
            .section-title{ font-size: 1.6rem; }
            .profile-name{ font-size: 3rem; }
            .profile-role{ font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Background -->
    <div class="mesh-background"></div>
    <div class="mesh-overlay"></div>

    <!-- HEADER -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo-wrapper">
                <div class="logo-text"></div>
            </div>
            
            <nav class="desktop-nav">
                <a href="https://aditya-cmd-max.github.io/marina/" class="nav-item">Home</a>
                <a href="https://aditya-cmd-max.github.io/marina/articles" class="nav-item">Articles</a>

            <div class="header-actions">

    <!-- PROFILE CONTENT -->
    <main class="profile-container">
        <!-- Profile data will be populated from profilesmarina.json -->
        <div id="profileContent">
            <!-- Loading state -->
            <div class="loading-spinner" id="profileLoading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-svgs">
            <svg class="footer-svg footer-svg-1" viewBox="0 0 100 100"><path d="M50,10 L90,50 L50,90 L10,50Z"/></svg>
            <svg class="footer-svg footer-svg-2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>
            <svg class="footer-svg footer-svg-3" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90"/></svg>
        </div>
        
        <div class="footer-brand">Reverbit Marina</div>
        <p class="footer-tagline">A part of Reverbit Innovations</p>
        
        <div class="footer-grid">
            <div class="footer-col">
                <h4>Navigation</h4>
                <a href="https://aditya-cmd-max.github.io/marina/">Home</a>
                <a href="https://aditya-cmd-max.github.io/marina/articles">Articles</a>
                <a href="#">Profile</a>
                <a href="https://aditya-cmd-max.github.io/marina/articles/categories">Categories</a>

            </div>
            <div class="footer-col">
                <h4>Teams</h4>
                <a href="https://aditya-cmd-max.github.io/ekatvaai">Ekatva AI</a>
                <a href="https://aditya-cmd-max.github.io/mindscribe">Mindscribe</a>
                <a href="https://aditya-cmd-max.github.io/clover">Clover Studio</a>
                <a href="https://aditya-cmd-max.github.io/Peo">Peo-TTS</a>
            </div>
            <div class="footer-col">
                <h4>Connect</h4>
                <a href="https://github.com/aditya-cmd-max">GitHub</a>
                <a href="https://www.linkedin.com/in/aditya-jha-2b0860399/">LinkedIn</a>
                <a href="https://youtube.com/@Reverbit">YouTube</a>
            </div>
        </div>

                <span>© 2026 Reverbit Marina. All rights reserved.</span>

            <div class="footer-attribution">
                Made with <i class="fas fa-heart"></i> by Aditya Jha
            </div>
            
            <div class="social-links">
                <a href="https://youtube.com/@Reverbit" class="social-link"><i class="fab fa-youtube"></i></a>
                <a href="https://www.linkedin.com/in/aditya-jha-2b0860399/" class="social-link"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://github.com/aditya-cmd-max" class="social-link"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // ===== FETCH ARTICLES FROM JSON =====
        async function fetchArticles() {
            try {
                const response = await fetch('https://aditya-cmd-max.github.io/marina/articlesmarina.json');
                const articles = await response.json();
                return articles;
            } catch (error) {
                console.error('Error fetching articles:', error);
                return [];
            }
        }

        // ===== FETCH PROFILE FROM JSON =====
        async function fetchProfile() {
            try {
                const response = await fetch('https://aditya-cmd-max.github.io/marina/profilesmarina.json');
                const profiles = await response.json();
                // Find Aditya's profile
                const profile = profiles.find(p => p.name === "Aditya Jha");
                return profile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                return null;
            }
        }

        // Helper: Get thumbnail URL
        function getThumbnailUrl(article) {
            if (article.thumbnail) {
                if (article.thumbnail.startsWith('http')) {
                    return article.thumbnail;
                } else {
                    return `https://aditya-cmd-max.github.io${article.thumbnail}`;
                }
            }
            // Fallback images
            const category = article.category || '';
            if (category.includes('AI') || category.includes('Intelligence')) {
                return 'https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=80';
            } else if (category.includes('Programming')) {
                return 'https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=800&q=80';
            } else if (category.includes('Technology')) {
                return 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80';
            } else {
                return 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=80';
            }
        }

        // Helper: Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // Helper: Format joined date
        function formatJoinedDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
        }

        // ===== DISPLAY PROFILE AND ARTICLES =====
        async function displayProfile() {
            const profileContent = document.getElementById('profileContent');
            const profileLoading = document.getElementById('profileLoading');
            
            try {
                // Fetch both profile and articles in parallel
                const [profile, articles] = await Promise.all([fetchProfile(), fetchArticles()]);

                if (!profile) {
                    profileContent.innerHTML = `
                        <div class="no-results">
                            <span class="material-icons-round" style="font-size: 64px;">error_outline</span>
                            <h3>Profile not found</h3>
                            <p>Unable to load profile information</p>
                        </div>
                    `;
                    return;
                }

                // === EXACT FILTER AS REQUESTED ===
                const authorArticles = articles.filter(a => a.author === "Aditya Jha");
                
                // Sort by date (newest first) and get stats
                const sortedArticles = [...authorArticles].sort((a, b) => new Date(b.date) - new Date(a.date));
                const latestArticles = sortedArticles.slice(0, 3);
                const totalArticles = authorArticles.length;
                
                // Calculate total reads (mock for now)
                const totalReads = authorArticles.reduce((sum, article) => {
                    return sum + (article.reads || Math.floor(Math.random() * 500) + 100);
                }, 0);

                // Build profile HTML
                const joinedDate = formatJoinedDate(profile.joined);
                
                profileContent.innerHTML = `
                    <!-- Hero Section -->
                    <section class="profile-hero fade-in">
                        <div class="profile-image-container">
                            <div class="profile-image-wrapper">
                                <img src="${profile.avatar}" alt="${profile.name}" class="profile-image" onerror="this.src='https://ui-avatars.com/api/?name=${profile.name}&background=1a73e8&color=fff&size=300'">
                            </div>
                        </div>
                        
                        <div class="profile-info">
                            <h1 class="profile-name">${profile.name}</h1>
                            <p class="profile-role">${profile.role}</p>
                            
                            <div class="profile-badges">
                                ${profile.badges ? profile.badges.map(badge => 
                                    `<span class="badge">${badge}</span>`
                                ).join('') : ''}
                            </div>
                            
                            <div class="profile-meta">
                                <div class="profile-meta-item">
                                    <span class="material-icons-round">location_on</span>
                                    <span>${profile.location || 'India'}</span>
                                </div>
                                <div class="profile-meta-item">
                                    <span class="material-icons-round">calendar_today</span>
                                    <span>Joined ${joinedDate}</span>
                                </div>
                                ${profile.verified ? `
                                <div class="profile-meta-item">
                                    <span class="material-icons-round">verified</span>
                                    <span>Verified Author</span>
                                </div>
                                ` : ''}
                            </div>
                            
                            <p class="profile-bio">${profile.bio}</p>
                            
                            <div class="profile-social">
                                ${profile.social?.github ? `
                                <a href="${profile.social.github}" class="social-icon" target="_blank"><i class="fab fa-github"></i></a>
                                ` : ''}
                                ${profile.social?.website ? `
                                <a href="${profile.social.website}" class="social-icon" target="_blank"><i class="fas fa-globe"></i></a>
                                ` : ''}
                                <a href="https://youtube.com/@Reverbit" class="social-icon" target="_blank"><i class="fab fa-youtube"></i></a>
                                <a href="https://linkedin.com/in/aditya-jha-2b0860399/" class="social-icon" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                            </div>
                        </div>
                    </section>

                    <!-- Stats Card -->
                    <div class="stats-card fade-in">
                        <div class="stat-item">
                            <div class="stat-value">${totalArticles}</div>
                            <div class="stat-label">Articles</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${totalReads.toLocaleString()}</div>
                            <div class="stat-label">Total Reads</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${new Date().getFullYear() - 2025}</div>
                            <div class="stat-label">Years Active</div>
                        </div>
                    </div>

                    <!-- Latest Articles -->
                    <section class="section fade-in">
                        <div class="section-header">
                            <h2 class="section-title">Latest Articles by ${profile.name}</h2>
                            <a href="https://aditya-cmd-max.github.io/marina/articles" class="section-link">
                                <span>View All</span>
                                <span class="material-icons-round">arrow_forward</span>
                            </a>
                        </div>
                        
                        <div class="articles-grid" id="articlesGrid">
                            ${renderArticles(latestArticles)}
                        </div>
                    </section>

                    <!-- Connect Cards -->
                    <section class="section fade-in">
                        <h2 class="section-title">Connect & Explore</h2>
                        <div class="cards-grid">
                            <!-- YouTube Card -->
                            <div class="profile-card">
                                <div class="card-header">
                                    <div class="card-icon">
                                        <i class="fab fa-youtube"></i>
                                    </div>
                                    <h3 class="card-title">YouTube Channel</h3>
                                </div>
                                <div class="card-content">
                                    <p class="card-description">Watch tech tutorials, AI discussions, and development vlogs.</p>
                                    <a href="https://www.youtube.com/@Reverbit" class="card-link" target="_blank">
                                        <i class="fab fa-youtube"></i>
                                        <span>Subscribe</span>
                                    </a>
                                </div>
                            </div>

                            <!-- Reverbit Card -->
                            <div class="profile-card">
                                <div class="card-header">
                                    <div class="card-icon">
                                        <i class="fas fa-blog"></i>
                                    </div>
                                    <h3 class="card-title">Reverbit</h3>
                                </div>
                                <div class="card-content">
                                    <p class="card-description">Building innovative AI solutions and exploring the future of technology.</p>
                                    <a href="https://aditya-cmd-max.github.io/" class="card-link" target="_blank">
                                        <span class="material-icons-round">arrow_forward</span>
                                        <span>Visit Reverbit</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </section>
                `;

                // Add click listeners to article cards
                document.querySelectorAll('.article-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('a')) {
                            const link = card.querySelector('.read-btn');
                            if (link) window.location.href = link.href;
                        }
                    });
                });

            } catch (error) {
                console.error('Error displaying profile:', error);
                profileContent.innerHTML = `
                    <div class="no-results">
                        <span class="material-icons-round" style="font-size: 64px;">error_outline</span>
                        <h3>Error loading profile</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                profileLoading.style.display = 'none';
            }
        }

        // Helper function to render articles
        function renderArticles(articles) {
            if (!articles || articles.length === 0) {
                return `
                    <div class="no-results">
                        <p>No articles found</p>
                    </div>
                `;
            }

            return articles.map(article => `
                <div class="article-card">
                    <img src="${getThumbnailUrl(article)}" class="article-image" alt="${article.title}" loading="lazy">
                    <div class="article-content">
                        <span class="article-category">${article.category || 'Technology'}</span>
                        <h3 class="article-title">${article.title}</h3>
                        <p class="article-excerpt">${article.description.substring(0, 100)}...</p>
                        
                        <div class="article-meta">
                            <span>${formatDate(article.date)}</span>
                            <span>•</span>
                            <span>${article.readTime || '5 min read'}</span>
                        </div>
                        
                        <a href="${article.link}" class="read-btn" target="_blank">
                            Read Article <span class="material-icons-round" style="font-size:18px;">arrow_forward</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Initialize profile
        displayProfile();

        // ===== THEME TOGGLE =====
        const body = document.body;
        const desktopThemeToggle = document.getElementById('desktopThemeToggle');
        const desktopThemeIcon = desktopThemeToggle.querySelector('.material-icons-round');
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
            desktopThemeIcon.textContent = 'light_mode';
        }

        function toggleTheme() {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            desktopThemeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            const menuThemeIcon = document.getElementById('menuThemeIcon');
            if (menuThemeIcon) {
                menuThemeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
            }
        }

        desktopThemeToggle.addEventListener('click', toggleTheme);

        // ===== HAMBURGER MENU =====
        const menuBtn = document.getElementById('menuBtn');
        const menuClose = document.getElementById('menuClose');
        const hamburgerMenu = document.getElementById('hamburgerMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuContent = document.getElementById('menuContent');

        function openMenu() { 
            hamburgerMenu.classList.add('active'); 
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }
        
        function closeMenu() { 
            hamburgerMenu.classList.remove('active'); 
            menuOverlay.classList.remove('active');
            document.body.style.overflow = ''; 
        }

        menuBtn.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && hamburgerMenu.classList.contains('active')) {
                closeMenu();
            }
        });

        // ===== POPULATE MENU =====
        function updateMenu(isLoggedIn = false, userData = null) {
            if (isLoggedIn && userData) {
                menuContent.innerHTML = `
                    <div class="menu-user">
                        <img src="${userData.photoURL || `https://ui-avatars.com/api/?name=${userData.displayName}&background=1a73e8&color=fff`}" class="menu-user-avatar">
                        <div class="menu-user-info">
                            <h4>${userData.displayName}</h4>
                            <p>${userData.email}</p>
                        </div>
                    </div>
                    
                    <div class="menu-links">
                        <a href="https://aditya-cmd-max.github.io/marina/" class="menu-link"><i class="fas fa-home"></i> Home</a>
                        <a href="https://aditya-cmd-max.github.io/marina/articles" class="menu-link"><i class="fas fa-newspaper"></i> Articles</a>
                        <a href="#" class="menu-link active"><i class="fas fa-user"></i> Profile</a>
                        <a href="https://aditya-cmd-max.github.io/marina/articles/categories" class="menu-link"><i class="fas fa-folder"></i> Categories</a>
                        <a href="https://aditya-cmd-max.github.io/marina/about" class="menu-link"><i class="fas fa-info-circle"></i> About</a>
                        <a href="https://aditya-cmd-max.github.io/dashboard" class="menu-link"><i class="fas fa-chart-line"></i> Dashboard</a>
                    </div>
                    
                    <div class="menu-theme" id="menuThemeToggle">
                        <div class="menu-theme-left">
                            <i class="fas fa-moon"></i>
                            <span>Dark Mode</span>
                        </div>
                        <span class="material-icons-round" id="menuThemeIcon">${body.classList.contains('dark-theme') ? 'light_mode' : 'dark_mode'}</span>
                    </div>
                    
                    <a href="#" class="menu-link signin-btn" onclick="window.ReverbitAuth?.logout(); return false;">
                        <i class="fas fa-sign-out-alt"></i> Sign Out
                    </a>
                `;
            } else {
                menuContent.innerHTML = `
                    <div class="menu-links">
                        <a href="https://aditya-cmd-max.github.io/marina/" class="menu-link"><i class="fas fa-home"></i> Home</a>
                        <a href="https://aditya-cmd-max.github.io/marina/articles" class="menu-link"><i class="fas fa-newspaper"></i> Articles</a>
                        <a href="https://aditya-cmd-max.github.io/marina/articles/categories" class="menu-link"><i class="fas fa-folder"></i> Categories</a>
                        <a href="https://aditya-cmd-max.github.io/marina/about" class="menu-link"><i class="fas fa-info-circle"></i> About</a>
                    </div>
                    
                    <div class="menu-theme" id="menuThemeToggle">
                        <div class="menu-theme-left">
                            <i class="fas fa-moon"></i>
                            <span>Dark Mode</span>
                        </div>
                        <span class="material-icons-round" id="menuThemeIcon">${body.classList.contains('dark-theme') ? 'light_mode' : 'dark_mode'}</span>
                    </div>
                    
                    <a href="https://aditya-cmd-max.github.io/signin" class="menu-link signin-btn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </a>
                `;
            }

            const menuThemeToggle = document.getElementById('menuThemeToggle');
            if (menuThemeToggle) {
                menuThemeToggle.addEventListener('click', toggleTheme);
            }
        }

        updateMenu(false);

        // ===== AUTH =====
        async function initAuth() {
            try {
                await window.ReverbitAuth.init();
                
                window.ReverbitAuth.addAuthListener((user, profile) => {
                    if (user && profile) {
                        updateMenu(true, profile);
                    } else {
                        updateMenu(false);
                    }
                });
                
            } catch (error) {
                console.error('Auth error:', error);
                updateMenu(false);
            }
        }

        initAuth();

        // GSAP Animations
        if (typeof gsap !== 'undefined') {
            gsap.from('.profile-hero', { duration: 1, y: 30, opacity: 0, ease: 'power3.out' });
            gsap.from('.stats-card', { duration: 1, y: 30, opacity: 0, delay: 0.2, ease: 'power3.out' });
            gsap.from('.section', { duration: 1, y: 30, opacity: 0, stagger: 0.2, ease: 'power3.out' });
        }
    </script>
</body>
</html>
